[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fraud-detection-mlops"
version = "1.0.0"
description = "End-to-end credit card fraud detection: feature engineering, XGBoost, evaluation, quality gate, API and CI/CD retraining."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dynamic = ["dependencies"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "httpx>=0.27"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["notebooks"]  # keep the original notebook exactly as authored

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
