# Reproduces the Logistic Regression + SMOTE baseline from notebooks/credit-card-fraud-detection.ipynb
# (same de-duplication, same 80/20 stratified split with random_state=42, default 0.5 threshold).
extends: configs/config.yaml

data:
  val_size: 0.0                       # the notebook trains on the full 80% training split
features:
  engineer_features: false
imbalance:
  strategy: smote
model:
  type: logistic_regression
  logistic_regression:
    max_iter: 100                     # sklearn default, as used in the notebook
threshold:
  strategy: fixed
  value: 0.5
artifacts:
  model_dir: models/baseline_logreg
  reports_dir: reports/baseline_logreg
